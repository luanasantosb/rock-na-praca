<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;

}

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: url("../rock-na-praca/assets/rock-na-praca.jpg") center/cover no-repeat;
  display: flex;
  justify-content: space-between;
  align-items: center;

}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
}

.left-box,
.right-box {
  position: relative;
  z-index: 2;
}

.left-box {
  padding-left: 60px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.big-title {
  font-size: 80px;
  font-weight: 900;
  line-height: 0.9;
  text-align: right;
  margin-right: 80px;
}

</style>
</head>
<body>
    
<section class="hero">
  <div class="overlay"></div>

  <div class="left-box">
Ola mundo!   
  </div>

  <div class="right-box">
    <h1 class="big-title">PATRIMONIO DO ROCK GAUCHO</h1>
  </div>
</section>


</body>
</html>
