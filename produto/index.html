<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#000000">
  <title>Produto | Rock na Praça</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../assets/CSS/estilo.css">

<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;800&display=swap" media="print" onload="this.media='all'">

<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;800&display=swap">
</noscript>

<script src="../assets/JS/script.js" defer></script>
</head>

<body>

  <a href="../loja/" class="produto-voltar">⬅ Voltar para a loja</a>

  <main class="produto-container">

    <!-- ESQUERDA -->
    <div class="produto-galeria">
      <img src="  id=" fotoPrincipal" class="produto-foto-principal" alt="Produto">
      <div id="miniaturas" class="produto-miniaturas"></div>
    </div>

    <!-- DIREITA -->
    <div class="produto-info">

      <h1 id="nome"></h1>
      <p id="descricao"></p>
      <div id="preco" class="preco"></div>

      <div id="variacoes" class="variacoes hidden">

        <div class="campo">
          <label for="tamanho">Tamanho</label>
          <select id="tamanho">
            <option value="">Selecione</option>
          </select>
        </div>

        <div class="campo">
          <label for="cor">Cor</label>
          <select id="cor">
            <option value="">Selecione</option>
          </select>
        </div>

      </div>

      <button id="btnCarrinho" class="btn-adicionar">
        Adicionar ao carrinho
      </button>

    </div>

  </main>

  <script>

    /* ==================== PRODUTOS ==================== */
    const produtos = [
      {
        id: "camiseta-rock-na-praca-1",
        nome: "CAMISETA MODELO #1",
        preco: 70.00,
        descricao: "Camiseta oficial Rock na Praça. 100% algodão.",
        imagens: [
          "../assets/loja_Rock-na-Praca/Camiseta-1_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-cores-tabela.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-tamanhos-tabela.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-1-Preta_Rock-na-Praca.webp"
        ],
        tamanhos: ["Babylook M", "Babylook G", "Babylook GG", "Babylook XG",
          "Camiseta PP", "Camiseta P", "Camiseta M", "Camiseta G", "Camiseta GG", "Camiseta XG", "Camiseta XXG"],
        cores: ["Preto", "Cinza Chumbo", "Cinza Mescla", "Preto Mescla", "Cinza Médio", "Branco", "Marrom", "Amarelo Canário", "Amarelo Ouro", "Amarelo Mostarda", "Laranja", "Vermelho", "Bordô", "Rosa Goiaba", "Rosa Bebê", "Rosa Pink", "Lilás", "Roxo", "Verde Fluor", "Azul Marinho", "Azul Royal", "Azul Jade", "Azul Turquesa", "Verde Bandeira", "Verde Folha", "Verde Musgo", "Crua (tom cru/bege claro)", "Raglan Mescla/Preto", "Raglan Mescla/Bordô", "Raglan Branco/Preto"]
      },
      {
        id: "camiseta-rock-na-praca-2",
        nome: "CAMISETA MODELO #2",
        preco: 70.00,
        descricao: "Camiseta oficial Rock na Praça. 100% algodão.",
        imagens: [
          "../assets/loja_Rock-na-Praca/Camiseta-2_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-cores-tabela.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-tamanhos-tabela.webp",
          "../assets/loja_Rock-na-Praca/Camiseta-2-Cinza_Rock-na-Praca.webp"
        ],
        tamanhos: ["Babylook M", "Babylook G", "Babylook GG", "Babylook XG",
          "Camiseta PP", "Camiseta P", "Camiseta M", "Camiseta G", "Camiseta GG", "Camiseta XG", "Camiseta XXG"],
        cores: ["Preto", "Cinza Chumbo", "Cinza Mescla", "Preto Mescla", "Cinza Médio", "Branco", "Marrom", "Amarelo Canário", "Amarelo Ouro", "Amarelo Mostarda", "Laranja", "Vermelho", "Bordô", "Rosa Goiaba", "Rosa Bebê", "Rosa Pink", "Lilás", "Roxo", "Verde Fluor", "Azul Marinho", "Azul Royal", "Azul Jade", "Azul Turquesa", "Verde Bandeira", "Verde Folha", "Verde Musgo", "Crua (tom cru/bege claro)", "Raglan Mescla/Preto", "Raglan Mescla/Bordô", "Raglan Branco/Preto"]
      },
      {
        id: "mochila-rock-na-praca",
        nome: "Mochila Rock na Praça",
        preco: 100.00,
        descricao: "Produto oficial.",
        imagens: ["../assets/loja_Rock-na-Praca/Mochila_Rock-na-Praca.webp"]
      },
      {
        id: "carteira-rock-na-praca",
        nome: "Carteira Rock na Praça",
        preco: 40.00,
        descricao: "Produto oficial.",
        imagens: ["../assets/loja_Rock-na-Praca/Carteira_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Carteira-aberta_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Carteira-fechada_Rock-na-Praca.webp"
        ],
      },
      {
        id: "copo-rock-na-praca",
        nome: "Copo Rock na Praça",
        preco: 10.00,
        descricao: "Produto oficial.",
        imagens: ["../assets/loja_Rock-na-Praca/Copo_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Copo-costas_Rock-na-Praca.webp",
          "../assets/loja_Rock-na-Praca/Copo-frente_Rock-na-Praca.webp"
        ],
      },
      {
        id: "bone-rock-na-praca-1",
        nome: "Boné Rock na Praça #1",
        preco: 70.00,
        descricao: "Produto oficial.",
        imagens: ["../assets/loja_Rock-na-Praca/Bone-1_Rock-na-Praca.webp"]
      },
      {
        id: "bone-rock-na-praca-2",
        nome: "Boné Rock na Praça #2",
        preco: 70.00,
        descricao: "Produto oficial.",
        imagens: ["../assets/loja_Rock-na-Praca/Bone-2_Rock-na-Praca.webp"]
      },
    ];


    function getCarrinho() {
      return JSON.parse(localStorage.getItem("carrinhoRNP")) || [];
    }

    function salvarCarrinho(carrinho) {
      localStorage.setItem("carrinhoRNP", JSON.stringify(carrinho));
    }

    function adicionarProduto(produto, tamanho, cor) {
      const carrinho = getCarrinho();

      carrinho.push({
        id: Date.now(),
        produtoId: produto.id,
        nome: produto.nome,
        preco: produto.preco,
        tamanho,
        cor
      });

      salvarCarrinho(carrinho);
      alert("Produto adicionado ao carrinho ");
    }


    document.addEventListener("DOMContentLoaded", () => {

      const params = new URLSearchParams(window.location.search);
      const produtoId = params.get("produto");

      if (!produtoId) {
        alert("Produto não informado na URL.");
        return;
      }


      const produto = produtos.find(p => p.id === produtoId);

      if (!produto) {
        alert("Produto não encontrado.");
        return;
      }

      const nomeEl = document.getElementById("nome");
      const descEl = document.getElementById("descricao");
      const precoEl = document.getElementById("preco");
      const fotoPrincipal = document.getElementById("fotoPrincipal");
      const miniaturas = document.getElementById("miniaturas");
      const variacoesDiv = document.getElementById("variacoes");
      const selectTamanho = document.getElementById("tamanho");
      const selectCor = document.getElementById("cor");
      const btnCarrinho = document.getElementById("btnCarrinho");

      nomeEl.textContent = produto.nome;
      descEl.textContent = produto.descricao;
      precoEl.textContent = `R$ ${produto.preco.toFixed(2).replace(".", ",")}`;

      fotoPrincipal.src = produto.imagens[0];


      miniaturas.innerHTML = "";
      produto.imagens.forEach(imgSrc => {
        const img = document.createElement("img");
        img.src = imgSrc;
        img.classList.add("miniatura");
        img.addEventListener("click", () => {
          fotoPrincipal.src = imgSrc;
        });
        miniaturas.appendChild(img);
      });

      configurarVariacoes(produto, variacoesDiv, selectTamanho, selectCor);

      btnCarrinho.addEventListener("click", () => {
        const tamanho = selectTamanho?.value || null;
        const cor = selectCor?.value || null;

        if (produto.tamanhos && !tamanho) {
          alert("Selecione um tamanho");
          return;
        }

        if (produto.cores && !cor) {
          alert("Selecione uma cor ");
          return;
        }

        adicionarProduto(produto, tamanho, cor);
      });

    });


    function configurarVariacoes(produto, variacoesDiv, selectTamanho, selectCor) {

      if (!produto.tamanhos && !produto.cores) {
        variacoesDiv.style.display = "none";
        return;
      }

      variacoesDiv.style.display = "block";


      if (produto.tamanhos) {
        selectTamanho.innerHTML = `<option value="">Selecione o tamanho</option>`;
        produto.tamanhos.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          selectTamanho.appendChild(opt);
        });
      } else {
        selectTamanho.parentElement.style.display = "none";
      }


      if (produto.cores) {
        selectCor.innerHTML = `<option value="">Selecione a cor</option>`;
        produto.cores.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          selectCor.appendChild(opt);
        });
      } else {
        selectCor.parentElement.style.display = "none";
      }
    }

  </script>
</body>

</html>
