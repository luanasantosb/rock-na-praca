<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#000000">
  <title>Produto | Rock na Praça</title>

  <link rel="preload" href="../assets/fonts/OpenSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/BebasNeue.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../assets/CSS/estilo.css">

  <script src="../assets/JS/script.js" defer></script>
</head>

<body>

  <a href="../loja/" class="produto-voltar">⬅ Voltar para a loja</a>

  <main class="produto-container">

    <div class="produto-galeria">
      <img id="fotoPrincipal" class="produto-foto-principal" alt="Produto Principal">
      <div id="miniaturas" class="produto-miniaturas"></div>
    </div>

    <div class="produto-info">
      <h1 id="nome"></h1>
      <p id="descricao"></p>
      <div id="preco" class="preco"></div>

      <div id="variacoes" class="variacoes hidden">
        <div class="campo" id="campo-tamanho">
          <label for="tamanho">Tamanho</label>
          <select id="tamanho">
            <option value="">Selecione</option>
          </select>
        </div>

        <div class="campo" id="campo-cor">
          <label for="cor">Cor</label>
          <select id="cor">
            <option value="">Selecione</option>
          </select>
        </div>
      </div>

      <button id="btnCarrinho" class="btn-adicionar">
        Adicionar ao carrinho
      </button>
    </div>

  </main>

  <script>
    function getCarrinho() {
      return JSON.parse(localStorage.getItem("carrinhoRNP")) || [];
    }

    function salvarCarrinho(carrinho) {
      localStorage.setItem("carrinhoRNP", JSON.stringify(carrinho));
    }

    function adicionarProduto(produto, tamanho, cor) {
      const carrinho = getCarrinho();

      carrinho.push({
        id: Date.now(),
        produtoId: produto.slug,
        nome: produto.titulo || produto.nome || "",
        preco: produto.preco || 0,
        tamanho: tamanho || null,
        cor: cor || null,
        imagem: obterImagemPrincipal(produto)
      });

      salvarCarrinho(carrinho);
      alert("Produto adicionado ao carrinho");
    }

    function formatarPreco(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function preencherSelect(select, valores, placeholder) {
      if (!select) return;

      select.innerHTML = `<option value="">${placeholder}</option>`;

      valores.forEach(valor => {
        if (!valor) return;

        const option = document.createElement("option");
        option.value = valor;
        option.textContent = valor;
        select.appendChild(option);
      });
    }

    function normalizarImagens(produto) {
      const lista = [];

      if (produto.imagem && typeof produto.imagem === "string") {
        lista.push(produto.imagem.trim());
      }

      if (Array.isArray(produto.imagens)) {
        produto.imagens.forEach(img => {
          if (typeof img === "string") {
            lista.push(img.trim());
          }
        });
      }

      return [...new Set(lista.filter(Boolean))];
    }

    function obterImagemPrincipal(produto) {
      const imagens = normalizarImagens(produto);
      return imagens[0] || "";
    }

    function obterGaleria(produto) {
      return normalizarImagens(produto);
    }



    function configurarVariacoes(produto) {
      const variacoesDiv = document.getElementById("variacoes");
      const campoTamanho = document.getElementById("campo-tamanho");
      const campoCor = document.getElementById("campo-cor");
      const selectTamanho = document.getElementById("tamanho");
      const selectCor = document.getElementById("cor");

      const temTamanhos = Array.isArray(produto.tamanhos) && produto.tamanhos.length > 0;
      const temCores = Array.isArray(produto.cores) && produto.cores.length > 0;

      selectTamanho.innerHTML = `<option value="">Selecione</option>`;
      selectCor.innerHTML = `<option value="">Selecione</option>`;

      if (!temTamanhos && !temCores) {
        variacoesDiv.style.display = "none";
        return;
      }

      variacoesDiv.style.display = "block";

      if (temTamanhos) {
        campoTamanho.style.display = "";
        preencherSelect(selectTamanho, produto.tamanhos, "Selecione o tamanho");
      } else {
        campoTamanho.style.display = "none";
      }

      if (temCores) {
        campoCor.style.display = "";
        preencherSelect(selectCor, produto.cores, "Selecione a cor");
      } else {
        campoCor.style.display = "none";
      }
    }

    function renderizarGaleria(produto) {
      const fotoPrincipal = document.getElementById("fotoPrincipal");
      const miniaturas = document.getElementById("miniaturas");
      const imagens = obterGaleria(produto);
      const nomeProduto = produto.titulo || produto.nome || "Produto";

      miniaturas.innerHTML = "";

      if (!imagens.length) {
        fotoPrincipal.removeAttribute("src");
        fotoPrincipal.alt = nomeProduto;
        return;
      }

      fotoPrincipal.src = imagens[0];
      fotoPrincipal.alt = nomeProduto;

      imagens.forEach(imgSrc => {
        const img = document.createElement("img");
        img.src = imgSrc;
        img.alt = nomeProduto;
        img.classList.add("miniatura");

        img.addEventListener("click", () => {
          fotoPrincipal.src = imgSrc;
        });

        miniaturas.appendChild(img);
      });
    }

    async function carregarProdutoIndividual() {
      const params = new URLSearchParams(window.location.search);
      const produtoSlug = params.get("produto");

      if (!produtoSlug) {
        alert("Produto não informado na URL.");
        return;
      }

      try {
        const response = await fetch("../content/produtos.json");

        if (!response.ok) {
          throw new Error("Não foi possível carregar o arquivo de produtos.");
        }

        const data = await response.json();
        const produtos = Array.isArray(data.produtos) ? data.produtos : [];
        const produto = produtos.find(p => p.slug === produtoSlug);

        if (!produto) {
          alert("Produto não encontrado.");
          return;
        }

        const nomeEl = document.getElementById("nome");
        const descEl = document.getElementById("descricao");
        const precoEl = document.getElementById("preco");
        const btnCarrinho = document.getElementById("btnCarrinho");
        const selectTamanho = document.getElementById("tamanho");
        const selectCor = document.getElementById("cor");

        nomeEl.textContent = produto.titulo || produto.nome || "";
        descEl.textContent = produto.descricao || "";
        precoEl.textContent = produto.preco != null ? formatarPreco(produto.preco) : "";

        renderizarGaleria(produto);
        configurarVariacoes(produto);

        btnCarrinho.addEventListener("click", () => {
          const tamanho = selectTamanho?.value || "";
          const cor = selectCor?.value || "";

          const precisaTamanho = Array.isArray(produto.tamanhos) && produto.tamanhos.length > 0;
          const precisaCor = Array.isArray(produto.cores) && produto.cores.length > 0;

          if (precisaTamanho && !tamanho) {
            alert("Selecione um tamanho");
            return;
          }

          if (precisaCor && !cor) {
            alert("Selecione uma cor");
            return;
          }

          adicionarProduto(produto, tamanho, cor);
        });
      } catch (erro) {
        console.error("Erro ao carregar produto:", erro);
        alert("Erro ao carregar o produto.");
      }
    }

    document.addEventListener("DOMContentLoaded", carregarProdutoIndividual);
  </script>
</body>

</html>
