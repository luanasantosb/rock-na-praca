<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Rock na Praça</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="../assets/geral/share-image.webp" />

  <!-- Cor do navegador no mobile -->
  <meta name="theme-color" content="#0b0b0b" />

  <style>
    body {
      background: #0b0b0b;
    }

    /* Fundo geral do Decap */
    [class*="AppMainContainer"],
    [class*="AppHeaderContent"],
    [class*="SidebarContainer"] {
      background-color: #0b0b0b !important;
      color: #f2f2f2 !important;
    }

    /* Cards, listas e áreas internas */
    [class*="Card"],
    [class*="CollectionTopContainer"],
    [class*="EditorContainer"],
    [class*="ControlPaneContainer"],
    [class*="PreviewPaneContainer"] {
      background-color: #161616 !important;
      color: #f2f2f2 !important;
      border-color: #2a2a2a !important;
    }

    /* Textos */
    h1, h2, h3, h4, h5, h6,
    label, span, p, div {
      color: #f2f2f2;
    }

    /* Inputs */
    input, textarea, select {
      background-color: #101010 !important;
      color: #ffffff !important;
      border: 1px solid #333 !important;
    }

    /* Botões */
    button {
      background-color: #d71920 !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      border: none !important;
    }

    button:hover {
      background-color: #ff2a2a !important;
    }

    /* Links e destaques */
    a {
      color: #ff3b3b !important;
    }
  </style>
</head>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
