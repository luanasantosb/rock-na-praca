backend:
  name: github
  repo: luanasantosb/rocknapraca.com
  branch: main
  base_url: https://rocknapraca-oauth.vercel.app
  auth_endpoint: /api/auth
  site_domain: www.rocknapraca.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Página Inicial"
    files:
      - label: "Página Inicial-Hero"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - { label: "Ícone da Insígnia", name: "insignia_icone", widget: "string", default: "🏛️" ,required: false}
          - { label: "Texto da Insígnia", name: "insignia_texto", widget: "string", required: false }
          - { label: "Título", name: "titulo", widget: "string", required: false }
          - { label: "Edição", name: "edicao", widget: "string", required: false }
          - { label: "Subtítulo", name: "subtitulo", widget: "string", required: false }
          - { label: "Data", name: "data_evento", widget: "string", required: false }
          - { label: "Data ISO", name: "data_iso", widget: "string", required: false }
          - { label: "Local", name: "local", widget: "string", required: false }
          - { label: "Cidade", name: "cidade", widget: "string", required: false }
          - { label: "Estado", name: "estado", widget: "string", required: false }
          - { label: "Texto do Botão", name: "botao_texto", widget: "string", required: false }
          - { label: "Imagem", name: "imagem", widget: "image", required: false }

collections:
  - name: "inscricao"
    label: "Página de Inscrição - Feira"
    files:
      - file: "content/inscricao.json"
        label: "Configuração de Inscrição Feira"
        name: "inscricao"
        fields:
          - label: "Inscrição Feira Aviso"
            name: "inscricaoFeiraAviso"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Local", name: "local", widget: "string" }
              - { label: "Taxa", name: "taxa", widget: "string" }
              - { label: "Pix", name: "pix", widget: "string" }