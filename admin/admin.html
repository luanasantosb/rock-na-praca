<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #111;
      border: 1px solid #333;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Login Admin</h2>

  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">

  <button onclick="login()">Entrar</button>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://qyeqoskwclrkdnqqdyau.supabase.co",
  "sb_publishable_LfjaIA-PuCkFg1oJ4Qwjew_0JwJTwTb"
);

async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password: senha
  });

  if (error) {
    alert("Erro no login ❌");
  } else {
    alert("Login realizado ✅");

    window.location.href = "dashboard.html";
  }
}
</script>

</body>
</html>
