</head>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--preto);
      margin: 0;
      padding: 0;
    }

    .container-produto {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      border-radius: 8px;
    }

    /* ===== IMAGENS ===== */
    .galeria {
      display: flex;
      flex-direction: column;
    }

    .imagem-principal {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .miniaturas {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .miniaturas img {
      width: 70px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 4px;
    }

    .miniaturas img:hover {
      border-color: #000;
    }

    /* ===== INFOS ===== */
    .infos h1 {
      margin: 0 0 10px;
    }

    .preco {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .descricao {
      margin: 15px 0;
      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      background: #000;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #333;
    }

    @media (max-width: 768px) {
      .container-produto {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container-produto">
    
    <!-- GALERIA -->
    <div class="galeria">
      <img id="imagemPrincipal" class="imagem-principal" src="" alt="Produto">
      <div id="miniaturas" class="miniaturas"></div>
    </div>

    <!-- INFOS -->
    <div class="infos">
      <h1 id="nomeProduto"></h1>
      <div class="preco" id="precoProduto"></div>
      <p class="descricao" id="descricaoProduto"></p>

      <label>Tamanho</label>
      <select>
        <option>PP</option>
        <option>P</option>
        <option>M</option>
        <option>G</option>
        <option>GG</option>
        <option>XG</option>
      </select>

      <label>Cor</label>
      <select>
        <option>Preto</option>
        <option>Branco</option>
        <option>Cinza</option>
        <option>Vermelho</option>
      </select>

      <button>Adicionar ao carrinho</button>
    </div>

  </div>

  <script>
    const produto = JSON.parse(localStorage.getItem("produtoSelecionado"));

    if (!produto) {
      alert("Nenhum produto selecionado.");
      window.location.href = "index.html";
    }

    const imagemPrincipal = document.getElementById("imagemPrincipal");
    const miniaturas = document.getElementById("miniaturas");

    document.getElementById("nomeProduto").textContent = produto.nome;
    document.getElementById("precoProduto").textContent = 
      "R$ " + Number(produto.preco).toFixed(2).replace(".", ",");
    document.getElementById("descricaoProduto").textContent = produto.descricao;

    // imagem principal inicial
    imagemPrincipal.src = produto.imagens[0];

    // criar miniaturas
    produto.imagens.forEach(img => {
      const imagem = document.createElement("img");
      imagem.src = img;

      imagem.addEventListener("click", () => {
        imagemPrincipal.src = img;
      });

      miniaturas.appendChild(imagem);
    });
  </script>

</body>
</html>
