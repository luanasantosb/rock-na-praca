<script>
  const params = new URLSearchParams(window.location.search);

  const nome = params.get("nome");
  const preco = params.get("preco");
  const descricao = params.get("descricao");
  const imagens = params.get("imagens")?.split(",") || [];

  document.getElementById("nomeProduto").textContent = nome || "";
  document.getElementById("precoProduto").textContent = preco || "";
  document.getElementById("descricaoProduto").textContent = descricao || "";

  const imagemPrincipal = document.getElementById("imagemProduto");
  const galeria = document.getElementById("galeria-produto");

  if (imagens.length > 0) {
    imagemPrincipal.src = imagens[0].trim();
  }

  imagens.forEach(src => {
    const img = document.createElement("img");
    img.src = src.trim();
    img.alt = "Imagem do produto";

    img.addEventListener("click", () => {
      imagemPrincipal.src = img.src;
    });

    galeria.appendChild(img);
  });
</script>
