              </select>

      </select>

      <button class="botao-adicionar" id="btnAdicionar">
        Adicionar ao carrinho
      </button>
    </div>

  </main>

  <script>
    // ===== LENDO DADOS DA URL =====
    const params = new URLSearchParams(window.location.search);

    const produto = {
      nome: params.get("nome"),
      preco: params.get("preco"),
      imagem: params.get("imagem"),
      descricao: params.get("descricao")
    };

    // ===== POPULANDO A TELA =====
    document.getElementById("nomeProduto").innerText = produto.nome;
    document.getElementById("precoProduto").innerText =
      parseFloat(produto.preco).toFixed(2);
    document.getElementById("descricaoProduto").innerText = produto.descricao;
    document.getElementById("imagemProduto").src = produto.imagem;
    document.getElementById("imagemProduto").alt = produto.nome;

    // ===== BOTÃO CARRINHO =====
    document.getElementById("btnAdicionar").addEventListener("click", () => {
      const tamanho = document.getElementById("tamanho").value;
      const cor = document.getElementById("cor").value;

      adicionar(
        null,
        produto.nome + " - " + tamanho + " - " + cor,
        parseFloat(produto.preco)
      );
    });
  </script>
