<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Em breve</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background-color: #212121;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fffef6;
}

.container {
  text-align: center;
}

h1 {
  font-size: 2.5rem;
  margin-top: 20px;
}

p {
  font-size: 1.2rem;
  opacity: 0.8;
}

.voltar {
  display: inline-block;
  margin: 1.5rem;
  color: #6ed47a;
  text-decoration: none;
  font-weight: 600;
  transition: opacity .2s ease;
}

.voltar:hover {
  opacity: .7;
}

.loader {
  width: 80px;
  height: 80px;
  border: 6px solid #444;
  border-top: 6px solid #6ed47a;
  border-radius: 50%;
  animation: girar 1s linear infinite;
  margin: 0 auto;
}

@keyframes girar {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

  </style>
</head>
<body>

  <div class="container">
    <div class="loader"></div>
    <h1>Aguarde...</h1>
    <p>Estamos preparando a próxima edição 🎸<br>
      <a href="index.html" class="voltar">⬅ Voltar para o site</a>
  </p>
  </div>

</body>
</html>
