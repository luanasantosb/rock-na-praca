<body>
  <header class="cabecalho-programacao">
    <div class="cabecalho-simbolo">
      <a href="/">
        <img src="/assets/images/uploads/rock-na-praca_simbolo.webp" alt="Rock na Praça logo: Cabeça estilizada de criatura verde com espinhos
                    representando a marca do evento" height="80" width="130">

    <nav class="cabecalho-menu-programacao" id="menu-programacao">

  </header>

  <main class="main-programacao">
    <section class="hero-programacao">
      <h1 id="titulo-programacao"><!-- Via JSON --></h1>
      <h2 id="subtitulo-programacao"><!-- Via JSON --></h2>

      <p class="conteudo-descricao" id="resumo-programacao">
        <!-- Via JSON -->
      </p>
    </section>

    <section class="grupo-realizacao">
      <div class="grid-realizacao">
        <div class="item" id="bloco-realizacao">
          <a id="link-realizacao" target="_blank" rel="noopener noreferrer">
            <img id="logo-realizacao" class="logo-balaiada" src="" alt="">
          </a>
          <span class="legenda" id="nome-realizacao"><!-- renderizado via JavaScript--></span>
        </div>

        <div class="item" id="bloco-apoio-institucional">
          <a id="link-apoio-institucional" target="_blank" rel="noopener noreferrer">
            <img id="logo-apoio-institucional" class="logo-prefeitura" src="" alt="">
          </a>
          <span class="legenda" id="texto-apoio-institucional"><!-- renderizado via JavaScript--></span>
        </div>
      </div>
    </section>

    <section class="grade-bandas" id="bandas">
      <h2 id="titulo-grade-bandas"><!-- renderizado via JavaScript--></h2>

      <ul class="grade-bandas-container" id="lista-bandas">
        <!-- Bandas renderizadas via JavaScript -->
      </ul>
    </section>

    <section id="feira" class="grupo-feira">
      <h2 id="titulo-feira"><!-- renderizado via JavaScript--></h2>

    <section id="apoio" class="grupo-apoio">

        <!-- Apoiadores renderizados via JavaScript -->

      <div class="local-grid">
        <div class="card-local">
          <h3>📍 Endereço</h3>

          <address id="endereco"><!-- renderizado via JavaScript--></address>

          <a id="link-endereco" href="" target="_blank" class="botao-mapa">
            Abrir no Google Maps
          </a>
        </div>

        <div class="card-local">
          <h3>🚆 Transporte</h3>

            <thead>
              <tr>
                <th>Tipo</th>
                <th>Descrição</th>
              </tr>
            </thead>

            <!-- Itens renderizados via JavaScript -->
             </tbody>
          </table>

  <!-- RODAPÉ -->

  <script>
    async function carregarJSON(caminho) {
      try {
        const res = await fetch(caminho);
        if (!res.ok) return null;
        return await res.json();
      } catch (error) {
        console.warn(`Erro ao carregar ${caminho}`, error);
        return null;
      }
    }

    async function carregarProgramacao() {
      const hero = await carregarJSON('/content/programacao/hero.json');
      const realizacao = await carregarJSON('/content/programacao/realizacao.json');
      const gradeBandas = await carregarJSON('/content/programacao/grade-bandas.json');
      const feira = await carregarJSON('/content/programacao/feira.json');
      const apoio = await carregarJSON('/content/programacao/apoio.json');
      const local = await carregarJSON('/content/programacao/como-chegar.json');

      // TOPO
      if (hero) {
        setText('titulo-programacao', hero.titulo);
        setText('subtitulo-programacao', hero.subtitulo);
        setText('resumo-programacao', hero.resumo);
      }

      // REALIZAÇÃO 
      const gridRealizacao = document.querySelector('.grid-realizacao');

      if (realizacao?.itens?.length && gridRealizacao) {
        gridRealizacao.innerHTML = '';

        realizacao.itens.forEach(item => {
          if (!item.nome && !item.logo) return;

          const div = document.createElement('div');
          div.className = 'item';

          div.innerHTML = `
          <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer">
            ${item.logo ? `<img class="logo-balaiada" src="${item.logo}" alt="${item.nome || ''}">` : ''}
          </a>
          <span class="legenda">${item.nome || ''}</span>
        `;

          gridRealizacao.appendChild(div);
        });
      }

      // BANDAS 
      if (gradeBandas) {
        setText('titulo-grade-bandas', gradeBandas.titulo);

        const listaBandas = document.getElementById('lista-bandas');
        if (listaBandas) listaBandas.innerHTML = '';

        if (gradeBandas.lista?.length && listaBandas) {
          gradeBandas.lista.forEach(banda => {
            if (!banda.nome && !banda.imagem) return;

            const li = document.createElement('li');
            li.className = 'grade-bandas-item';

            li.innerHTML = `
            <time class="hora">${banda.hora || ''}</time>

            <article class="banda">
              ${banda.imagem ? `<img src="${banda.imagem}" alt="${banda.nome || ''}">` : ''}

              <h3 class="banda-nome">${banda.nome || ''}</h3>

              <div class="banda-sociais">
                ${banda.instagram ? `
                  <a href="${banda.instagram}" target="_blank" rel="noopener noreferrer">
                    <img src="/assets/geral/instagram_logo.webp" alt="Instagram">
                  </a>` : ''}

                ${banda.youtube ? `
                  <a href="${banda.youtube}" target="_blank" rel="noopener noreferrer">
                    <img src="/assets/geral/youtube_logo.webp" alt="YouTube">
                  </a>` : ''}
              </div>
            </article>
          `;

            listaBandas.appendChild(li);
          });
        }
      }

      //FEIRA
      if (feira) {
        setText('titulo-feira', feira.titulo);
        setText('descricao-feira', feira.descricao);

        const listaLojas = document.getElementById('lista-lojas');
        if (listaLojas) listaLojas.innerHTML = '';

        if (feira.lojas?.length && listaLojas) {
          feira.lojas.forEach(loja => {
            if (!loja.imagem) return;

            const a = document.createElement('a');
            a.className = 'cartao-feira';
            a.href = loja.link || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            a.innerHTML = `
            <img src="${loja.imagem}" alt="" width="150" height="150">
          `;

            listaLojas.appendChild(a);
          });
        }
      }

      // APOIO
      if (apoio) {
        setText('titulo-apoio', apoio.titulo);
        setText('descricao-apoio', apoio.descricao);

        const listaApoio = document.getElementById('lista-apoio');
        if (listaApoio) listaApoio.innerHTML = '';

        if (apoio.lista?.length && listaApoio) {
          apoio.lista.forEach(item => {
            if (!item.imagem) return;

            const a = document.createElement('a');
            a.className = 'cartao-apoio';
            a.href = item.link || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            a.innerHTML = `<img src="${item.imagem}" alt="">`;

            listaApoio.appendChild(a);
          });
        }
      }

      //LOCAL
      if (local) {
  setText('titulo-local', local.titulo);
  setText('endereco', local.endereco);
  setLink('link-endereco', local.link_mapa);

  if (local.iframe_mapa) {
    const mapa = document.getElementById('mapa');
    if (mapa) mapa.src = local.iframe_mapa;
  }

  const tabelaAcesso = document.querySelector('.tabela-acesso tbody');

  if (tabelaAcesso) tabelaAcesso.innerHTML = '';

  if (local.transporte?.length && tabelaAcesso) {
    local.transporte.forEach(item => {
      let tipo = '-';
      let descricao = '';

      if (typeof item === 'string') {
        descricao = item;
      } else {
        tipo = item.tipo || '-';
        descricao = item.descricao || item.item || '';
      }

      if (!descricao) return;

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${tipo}</td>
        <td>${descricao}</td>
      `;

      tabelaAcesso.appendChild(tr);
    });
  }
}

        
    }

    //FUNÇÕES AUXILIARES
    function setText(id, value) {
      if (!value) return;
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setImg(id, src) {
      if (!src) return;
      const el = document.getElementById(id);
      if (el) el.src = src;
    }

    function setLink(id, href) {
      if (!href) return;
      const el = document.getElementById(id);
      if (el) el.href = href;
    }

    // INICIAR
    carregarProgramacao();
  </script>

</body>

</html>
