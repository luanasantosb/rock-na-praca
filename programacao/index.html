  <main class="programacao-conteudo">

  <script>
    async function carregarProgramacao() {
      const res = await fetch('/content/programacao.json');
      const data = await res.json();

      // ===== TEXTOS PRINCIPAIS =====
      setText('titulo-programacao', data.titulo);
      setText('subtitulo-programacao', data.subtitulo);
      setText('resumo-programacao', data.resumo);

      // ===== REALIZAÇÃO =====
      if (data.realizacao) {
        setText('nome-realizacao', data.realizacao.nome);
        setImg('logo-realizacao', data.realizacao.logo);
        setLink('link-realizacao', data.realizacao.link);
      }

      // ===== APOIO INSTITUCIONAL =====
      if (data.apoio_institucional) {
        setText('texto-apoio-institucional', data.apoio_institucional.texto);
        setImg('logo-apoio-institucional', data.apoio_institucional.logo);
        setLink('link-apoio-institucional', data.apoio_institucional.link);
      }

      // ===== BANDAS =====
      setText('titulo-grade-bandas', data.grade_bandas?.titulo);

      const listaBandas = document.getElementById('lista-bandas');

      if (data.grade_bandas?.lista?.length) {
        data.grade_bandas.lista.forEach(banda => {
          if (!banda.nome && !banda.imagem) return;

          const li = document.createElement('li');
          li.className = 'grade-bandas-item';

          li.innerHTML = `
        <time class="hora">${banda.hora || ''}</time>

        <article class="banda">
          ${banda.imagem ? `<img src="${banda.imagem}" alt="${banda.nome || ''}">` : ''}

          <h3 class="banda-nome">${banda.nome || ''}</h3>

          <div class="banda-sociais">
            ${banda.instagram ? `
              <a href="${banda.instagram}" target="_blank">
                <img src="/assets/geral/instagram_logo.webp">
              </a>` : ''}

            ${banda.youtube ? `
              <a href="${banda.youtube}" target="_blank">
                <img src="/assets/geral/youtube_logo.webp">
              </a>` : ''}
          </div>
        </article>
      `;

          listaBandas.appendChild(li);
        });
      }

      // ===== FEIRA =====
      setText('titulo-feira', data.feira?.titulo);
      setText('descricao-feira', data.feira?.descricao);

      const listaLojas = document.getElementById('lista-lojas');

      if (data.feira?.lojas?.length) {
        data.feira.lojas.forEach(loja => {
          if (!loja.imagem) return;

          const a = document.createElement('a');
          a.className = 'cartao-feira';
          a.href = loja.link || '#';
          a.target = '_blank';

          a.innerHTML = `
        <img src="${loja.imagem}" alt="" width="150" height="150">
      `;

          listaLojas.appendChild(a);
        });
      }

      // ===== APOIO =====
      setText('titulo-apoio', data.apoio?.titulo);
      setText('descricao-apoio', data.apoio?.descricao);

      const listaApoio = document.getElementById('lista-apoio');

      if (data.apoio?.lista?.length) {
        data.apoio.lista.forEach(item => {
          if (!item.imagem) return;

          const a = document.createElement('a');
          a.className = 'cartao-apoio';
          a.href = item.link || '#';
          a.target = '_blank';

          a.innerHTML = `<img src="${item.imagem}" alt="">`;

          listaApoio.appendChild(a);
        });
      }

      // ===== LOCAL =====
      setText('titulo-local', data.local?.titulo);
      setText('endereco', data.local?.endereco);
      setLink('link-endereco', data.local?.link_mapa);

      if (data.local?.iframe_mapa) {
        document.getElementById('mapa').src = data.local.iframe_mapa;
      }

      // Transporte
      const listaAcesso = document.getElementById('lista-acesso');

      if (data.local?.transporte?.length) {
        data.local.transporte.forEach(item => {
          if (!item) return;

          const li = document.createElement('li');
          li.textContent = item;
          listaAcesso.appendChild(li);
        });
      }
    }

    // ===== FUNÇÕES AUXILIARES =====
    function setText(id, value) {
      if (!value) return;
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setImg(id, src) {
      if (!src) return;
      const el = document.getElementById(id);
      if (el) el.src = src;
    }

    function setLink(id, href) {
      if (!href) return;
      const el = document.getElementById(id);
      if (el) el.href = href;
    }

    // ===== INICIAR =====
    carregarProgramacao();
  </script>

</body>
