</head>

<body style="font-family: 'Open Sans', sans-serif; background:#212121; color:#fffef6; display:flex; justify-content:center; align-items:center; text-align:center; height:100vh; margin:0;">

<div class="wrapper" style="padding:2rem; max-width:600px;">


  <h1 style="font-family:'Bebas Neue', sans-serif; font-size:2.5rem; margin-bottom:1rem;">
    Rock na Praça – Lançamento do Site Oficial
  </h1>

  <!-- Logo -->
  <div class="logo" style="margin-bottom:2rem;">
    <img src="./assets/logos/Rock-na-praca-logo-e-icone.png" alt="Logo Rock na Praça – Evento gratuito de Rock" style="max-width:220px; width:100%; height:auto;">
  </div>

  <!-- Texto explicativo -->
  <p style="margin-bottom:2rem;">
    Estamos preparando o site oficial do <strong>Rock na Praça</strong>! Fique ligado para informações sobre bandas, local e programação. Evento gratuito.
  </p>

  <!-- Contador -->
  <div class="countdown" id="countdown" style="display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; margin-bottom:2rem;">
    <div class="time-box" style="min-width:90px;">
      <div class="number" id="days" style="font-size:3rem; font-weight:bold; color:#6ed47a;">00</div>
      <div class="label" style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; opacity:0.7; margin-top:0.4rem;">Dias</div>
    </div>
    <div class="time-box" style="min-width:90px;">
      <div class="number" id="hours" style="font-size:3rem; font-weight:bold; color:#6ed47a;">00</div>
      <div class="label" style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; opacity:0.7; margin-top:0.4rem;">Horas</div>
    </div>
    <div class="time-box" style="min-width:90px;">
      <div class="number" id="minutes" style="font-size:3rem; font-weight:bold; color:#6ed47a;">00</div>
      <div class="label" style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; opacity:0.7; margin-top:0.4rem;">Minutos</div>
    </div>
    <div class="time-box" style="min-width:90px;">
      <div class="number" id="seconds" style="font-size:3rem; font-weight:bold; color:#6ed47a;">00</div>
      <div class="label" style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; opacity:0.7; margin-top:0.4rem;">Segundos</div>
    </div>
  </div>

  <!-- Links sociais -->
  <p style="margin-bottom:2rem;">
    Siga-nos no Instagram: <a href="https://www.instagram.com/rocknapraca_/" target="_blank" style="color:#6ed47a;">@rocknapraca_</a>
  </p>

  <!-- Footer -->
  <div class="footer" style="font-size:0.8rem; opacity:0.5;">© 2002-2026 Rock na Praça</div>
</div>

<!-- Contador JS -->
<script>
  const eventDate = new Date("2026-01-15T20:00:00-03:00").getTime();

  const timer = setInterval(() => {
    const now = new Date().getTime();
    const diff = eventDate - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");

    if (diff < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "<strong>🤘 O site está no ar!</strong>";
    }
  }, 1000);
</script>

</body>
</html>
