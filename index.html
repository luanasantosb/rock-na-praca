<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="Rock na Praça | Festival de Rock Independente">
  <meta property="og:description" content="Festival de rock, bandas independentes e cultura urbana. Acompanhe o lançamento oficial do site e todas as novidades.">
  <meta property="og:image" content="https://www.rocknapraca.com/assets/og/rock-na-praca.jpg">
  <meta property="og:url" content="https://www.rocknapraca.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rock na Praça">
  <meta property="og:locale" content="pt_BR">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rock na Praça | Festival de Rock Independente">
  <meta name="twitter:description" content="Acompanhe o lançamento do site do Rock na Praça. Bandas, programação e novidades em breve.">
  <meta name="twitter:image" content="https://www.rocknapraca.com/assets/og/rock-na-praca.jpg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="icon" href="/assets/logos/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/logos/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png">

  <title>Rock na Praça – Lançamento do Site</title>

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #212121;
      color: #fffef6;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      margin: 0;
      padding: 0 1rem;
    }

    .wrapper {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .logo img {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
    }

    p {
      margin-bottom: 2rem;
    }

    .countdown {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .time-box {
      min-width: 90px;
    }

    .number {
      font-size: 3rem;
      font-weight: bold;
      color: #6ed47a;
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 0.4rem;
    }

    a {
      color: #6ed47a;
      text-decoration: none;
    }

    .footer {
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <h1>Rock na Praça – Lançamento do Site</h1>

    <div class="logo">
      <img src="./assets/logos/Rock-na-praca-logo-e-icone.png" alt="Logo Rock na Praça – Evento gratuito de Rock">
    </div>

    <p>
      Estamos preparando o site oficial do <strong>Rock na Praça</strong>! Fique ligado para informações sobre bandas, local e programação. Evento gratuito.
    </p>

    <div class="countdown" id="countdown">
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">Dias</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">Horas</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutos</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">Segundos</div>
      </div>
    </div>

    <p>
      Siga-nos no Instagram: <a href="https://www.instagram.com/rocknapraca_/" target="_blank">@rocknapraca_</a>
    </p>

    <div class="footer">© 2002-2026 Rock na Praça</div>
  </div>

  <script>
    const eventDate = new Date("2026-01-15T20:00:00-03:00").getTime();

    const timer = setInterval(() => {
      const now = new Date().getTime();
      const diff = eventDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");

      if (diff < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = "<strong>🤘 O site está no ar!</strong>";
      }
    }, 1000);
  </script>
</body>
</html>
