<style>
  * {

    margin-top: 2.5rem;
    font-size: 0.8rem;

<body>

<div class="wrapper">

  <h1>Rock na praça</h1>
  <div class="logo">
    
    <img src="./assets/logos/Rock-na-praca-logo-e-icone.png" alt="Rock na Praça">
  </div>

  
  <div class="countdown" id="countdown">
    <div class="time-box">
      <div class="number" id="days">00</div>
      <div class="label">Dias</div>
    </div>
    <div class="time-box">
      <div class="number" id="hours">00</div>
      <div class="label">Horas</div>
    </div>
    <div class="time-box">
      <div class="number" id="minutes">00</div>
      <div class="label">Minutos</div>
    </div>
    <div class="time-box">
      <div class="number" id="seconds">00</div>
      <div class="label">Segundos</div>
    </div>
  </div>

  <div class="footer">© 2002-2026 Rock na Praça</div>

</div>

<script>
  
  const eventDate = new Date("2026-01-15T20:00:00").getTime();

  const timer = setInterval(() => {
    const now = new Date().getTime();
    const diff = eventDate - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");

    if (diff < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "<strong>🤘 É HOJE!</strong>";
    }
  }, 1000);
</script>
